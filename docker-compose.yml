# CreditProbe AI -- Deal Desk edition. Started and stopped by the Start-/Stop- scripts in this folder.
# Open http://127.0.0.1:6600 once it is up.
name: creditprobe-dealdesk

services:
  dealdesk:
    build:
      context: ./app
    image: creditprobe-dealdesk:2026-10-25
    container_name: creditprobe-dealdesk
    env_file:
      - path: ./settings.env
        required: false
    ports:
      # The browser calls the services at these addresses, so the numbers must stay the same on this computer.
      - "127.0.0.1:6600:6600"
      - "127.0.0.1:8500:8500"
      - "127.0.0.1:8504:8504"
      - "127.0.0.1:8505:8505"
      - "127.0.0.1:8506:8506"
      - "127.0.0.1:8508:8508"
      - "127.0.0.1:8510:8510"
      - "127.0.0.1:8517:8517"
    volumes:
      - dealdesk-data:/app/var
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  dealdesk-data:
